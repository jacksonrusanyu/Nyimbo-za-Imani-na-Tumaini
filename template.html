<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nyimbo za Tumaini na Imani</title>
<meta name="description" content="Nyimbo za Tumaini na Imani - maneno na chords za gitaa">
<meta name="theme-color" content="#8a1c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#faf8f5;--card:#fff;--ink:#1d1b19;--mute:#6b645d;--line:#e6e0d8;--acc:#8a1c1c;--accsoft:#f6e7e5;--chord:#1b4f9c;--capo:#b5530a;--fs:19px}
:root[data-theme=dark]{--bg:#15130f;--card:#1e1b17;--ink:#ece6dd;--mute:#a39b90;--line:#332e27;--acc:#e0877f;--accsoft:#2d1f1d;--chord:#7fb2ff;--capo:#f0a35e}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15130f;--card:#1e1b17;--ink:#ece6dd;--mute:#a39b90;--line:#332e27;--acc:#e0877f;--accsoft:#2d1f1d;--chord:#7fb2ff;--capo:#f0a35e}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font:700 1.05rem Georgia,"Times New Roman",serif;color:var(--acc);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:none;color:var(--acc);font-size:1.5rem;line-height:1;padding:2px 8px 2px 0;cursor:pointer;display:none}
.tools{max-width:760px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.sel{display:inline-flex;align-items:center;gap:6px;padding:4px 8px 4px 14px}.sel select{border:0;background:transparent;font:inherit;font-weight:700;color:inherit;padding:2px 2px;cursor:pointer}.sel.on{background:var(--capo);border-color:var(--capo);color:#fff}.sel.on select option{color:#000}.sel.dis{opacity:.45}.sel.dis select{cursor:not-allowed}
.bk{margin:4px 0 0}.bk button{border:1px solid var(--capo);color:var(--capo);background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.85rem}
.chip:disabled{opacity:.45;cursor:not-allowed}
.sp{flex:1}
main{max-width:760px;margin:0 auto;padding:16px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:1rem}
.count{color:var(--mute);font-size:.85rem;margin:8px 2px 4px}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list a{display:flex;gap:14px;align-items:baseline;padding:12px 4px;color:inherit;text-decoration:none}
.list a:hover,.list a:focus-visible{background:var(--accsoft)}
.no{font:700 1rem Georgia,serif;color:var(--acc);min-width:2.2em;text-align:right}
.tt{font-family:Georgia,"Times New Roman",serif;font-size:1.05rem}
.empty{color:var(--mute);text-align:center;padding:40px 0}
article h1{font:700 1.7rem/1.25 Georgia,"Times New Roman",serif;margin:6px 0 2px}
article h1 .n{color:var(--acc);margin-right:.35em}
.sub{color:var(--mute);font-style:italic;margin:0 0 6px}
.badge{display:inline-block;background:var(--capo);color:#fff;border-radius:6px;padding:2px 10px;font-weight:700;font-size:.85rem;margin:6px 0}
.sec{margin:18px 0;display:flex;gap:12px}
.lab{font:700 1.05rem Georgia,serif;color:var(--acc);min-width:1.7em;flex:none}
.body{flex:1;min-width:0;font:var(--fs)/1.55 Georgia,"Times New Roman",serif}
.sec.chorus .body{font-style:italic;border-left:3px solid var(--acc);padding-left:14px}
.sec.chorus .lab,.sec.other .lab{font-size:.85rem;font-style:italic;min-width:0}
.sec.chorus,.sec.other{display:block}
.sec.chorus .lab,.sec.other .lab{display:block;margin-bottom:4px}
.ln{margin:0}
.ln.ch{display:flex;flex-wrap:wrap;align-items:flex-end;margin-top:.15em}
.w{display:flex;align-items:flex-end}
.sg{display:flex;flex-direction:column;white-space:pre}
.c{font:700 .72em/1.3 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-style:normal;color:var(--chord);min-height:1.3em;padding-right:.4em}
.note{color:var(--mute);font-size:.9rem;font-style:italic;margin:6px 0}
.nav{display:flex;justify-content:space-between;gap:10px;margin:28px 0 10px}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button:disabled{opacity:.35;cursor:default}
.hint{color:var(--mute);font-size:.82rem;margin:4px 0 0}
@media print{header,.nav,.hint{display:none}body{background:#fff}}
</style>
</head>
<body>
<header>
 <div class="bar"><button class="back" id="back" aria-label="Rudi kwenye orodha">&#8592;</button><div class="brand" id="brand">Nyimbo za Tumaini na Imani</div>
  <button class="chip" id="themeBtn" aria-label="Badilisha rangi">&#9680;</button></div>
 <div class="tools">
  <button class="chip" id="chordBtn" aria-pressed="false">Chords</button>
  <label class="chip sel dis" id="capoWrap">Capo <select id="capoSel" aria-label="Chagua nafasi ya capo" disabled></select></label>
  <span class="sp"></span>
  <button class="chip" id="smaller" aria-label="Punguza herufi">A-</button>
  <button class="chip" id="bigger" aria-label="Ongeza herufi">A+</button>
 </div>
</header>
<main id="app"></main>
<script>
var SONGS = /*__DATA__*/[];
(function(){
 var app=document.getElementById('app'),$=function(i){return document.getElementById(i)};
 var store={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
 var S={chords:store.get('chords',false),capo:0,fs:store.get('fs',19),theme:store.get('theme',null),q:''};
 function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
 function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
 SONGS.forEach(function(s){s._k=norm(s.n+' '+s.t+' '+s.sec.map(function(x){return x.ln.join(' ')}).join(' '))});
 var SH=['C','C\u266f','D','D\u266f','E','F','F\u266f','G','G\u266f','A','A\u266f','B'],FL=['C','D\u266d','D','E\u266d','E','F','G\u266d','G','A\u266d','A','B\u266d','B'],IX={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
 function trChord(str,n,flat){
  if(!n||!str)return str;
  return str.replace(/([A-G])([\u266f\u266d#]?)/g,function(m,r,a){var v=IX[r]+(a==='\u266f'||a==='#'?1:(a==='\u266d'?-1:0));v=((v-n)%12+12)%12;return (flat?FL:SH)[v]});
 }
 var opts='';for(var o=0;o<=9;o++)opts+='<option value="'+o+'">'+(o===0?'0 (bila capo)':o)+'</option>';
 $('capoSel').innerHTML=opts;
 var cap=parseInt(S.capo,10);S.capo=(cap>=0&&cap<=9)?cap:0;
 SONGS.forEach(function(s){s._flat=s.sec.some(function(x){return (x.ch||[]).some(function(l){return l.some(function(c){return c[1]&&c[1].indexOf('\u266d')>-1})})})});
 function applyTheme(){if(S.theme)document.documentElement.setAttribute('data-theme',S.theme);else document.documentElement.removeAttribute('data-theme')}
 function applyFs(){document.documentElement.style.setProperty('--fs',S.fs+'px')}
 function syncBtns(){
  $('chordBtn').setAttribute('aria-pressed',S.chords);
  var sel=$('capoSel');sel.disabled=!S.chords;sel.value=String(S.capo);var w=$('capoWrap');w.classList.toggle('dis',!S.chords);w.classList.toggle('on',S.chords&&S.capo>0);
 }
 /* one lyric line with optional chords above syllables */
 function lineHTML(text,chords,flat){
  var use=S.chords&&chords&&chords.length;
  if(!use)return '<p class="ln">'+esc(text)+'</p>';
  var pick=function(c){return trChord(c[1],S.capo,flat)};
  var cs=[],i;
  chords.slice().sort(function(a,b){return a[0]-b[0]}).forEach(function(c){
   var t=pick(c),L=cs[cs.length-1];
   if(L&&L[0]===c[0]&&t)L[1]=L[1]+' '+t; else cs.push([c[0],t]);
  });
  var marks=cs.map(function(c){return Math.min(c[0],text.length)});
  var parts=[];
  if(marks[0]>0)parts.push({c:null,t:text.slice(0,marks[0])});
  for(i=0;i<cs.length;i++){var end=i+1<cs.length?marks[i+1]:text.length;parts.push({c:cs[i][1],t:text.slice(marks[i],end)})}
  var html='',word='';
  function endWord(){if(word){html+='<span class="w">'+word+'</span>';word=''}}
  parts.forEach(function(pt){
   var pieces=pt.t.split(/( )/),first=true;
   if(pt.t==='')pieces=['\u00a0'];
   pieces.forEach(function(pc){
    if(pc===' '){ word+='<span class="sg"><span class="c"></span><span>&nbsp;</span></span>'; endWord(); return}
    var ch=first?pt.c:null; first=false;
    word+='<span class="sg"><span class="c">'+(ch?esc(ch):'')+'</span><span>'+esc(pc)+'</span></span>';
   });
  });
  endWord();
  return '<p class="ln ch">'+html+'</p>';
 }
 function secHTML(sec,song){
  var lines=sec.ln.map(function(t,i){return lineHTML(t,sec.ch&&sec.ch[i],song._flat)}).join('');
  if(sec.k==='v')return '<div class="sec verse"><div class="lab">'+esc(sec.l)+'.</div><div class="body">'+lines+'</div></div>';
  var lab=sec.l?'<div class="lab">'+esc(sec.l)+':</div>':'';
  return '<div class="sec '+(sec.k==='c'?'chorus':'other')+'">'+lab+'<div class="body">'+lines+'</div></div>';
 }
 function route(){var m=location.hash.match(/^#\/(\d+)$/);return m?parseInt(m[1],10):null}
 function show(){
  var n=route(),song=n&&SONGS.filter(function(s){return s.n===n})[0];
  syncBtns();
  if(song){
   var idx=SONGS.indexOf(song),prev=SONGS[idx-1],next=SONGS[idx+1];
   document.title=song.n+'. '+song.t+' - Nyimbo za Tumaini na Imani';
   $('back').style.display='block';$('brand').textContent=song.n+'. '+song.t;
   var h='<article><h1><span class="n">'+song.n+'.</span>'+esc(song.t)+'</h1>';
   if(song.st)h+='<p class="sub">'+esc(song.st)+'</p>';
   if(S.chords){
    if(S.capo>0)h+='<span class="badge">Capo '+S.capo+'</span><p class="hint">Chords zinaonyesha umbo la kupiga ukiweka capo kwenye fret ya '+S.capo+'.</p>';
    else h+='<p class="hint">Chords za kawaida (bila capo). Chagua nafasi ya capo juu ili chords zibadilike.</p>';
    if(song.capo&&S.capo!==song.capo)h+='<p class="bk"><button id="bookCapo">Tumia capo ya kitabu (Capo '+song.capo+')</button></p>';
   }
   h+=song.sec.map(function(x){return secHTML(x,song)}).join('');
   (song.notes||[]).forEach(function(t){h+='<p class="note">'+esc(t)+'</p>'});
   if(song.credit)h+='<p class="note">'+esc(song.credit)+'</p>';
   h+='<div class="nav"><button id="prev" '+(prev?'':'disabled')+'>&#8592; '+(prev?esc(prev.n+'. '+prev.t):'')+'</button><button id="next" '+(next?'':'disabled')+'>'+(next?esc(next.n+'. '+next.t):'')+' &#8594;</button></div></article>';
   app.innerHTML=h;
   var bc=$('bookCapo');if(bc)bc.onclick=function(){S.capo=song.capo;store.set('capo',S.capo);show()};
   if(prev)$('prev').onclick=function(){location.hash='#/'+prev.n};
   if(next)$('next').onclick=function(){location.hash='#/'+next.n};
   window.scrollTo(0,0);
  }else{
   document.title='Nyimbo za Tumaini na Imani';
   $('back').style.display='none';$('brand').textContent='Nyimbo za Tumaini na Imani';
   app.innerHTML='<input class="search" id="q" type="search" placeholder="Tafuta kwa namba, jina au maneno..." autocomplete="off" value="'+esc(S.q)+'"><div class="count" id="cnt"></div><ul class="list" id="lst"></ul>';
   var q=$('q');q.oninput=function(){S.q=q.value;renderList()};renderList();
  }
 }
 function renderList(){
  var k=norm(S.q),items=SONGS;
  if(k){var num=/^\d+$/.test(k)?parseInt(k,10):null;
   items=SONGS.filter(function(s){return num!==null?String(s.n).indexOf(k)===0:s._k.indexOf(k)>-1});
   if(num!==null)items.sort(function(a,b){return (a.n===num?-1:0)-(b.n===num?-1:0)});}
  $('cnt').textContent=items.length+(items.length===1?' wimbo':' nyimbo');
  $('lst').innerHTML=items.length?items.map(function(s){return '<li><a href="#/'+s.n+'"><span class="no">'+s.n+'</span><span class="tt">'+esc(s.t)+'</span></a></li>'}).join(''):'<li class="empty">Hakuna wimbo uliopatikana.</li>';
 }
 $('back').onclick=function(){location.hash=''};
 $('chordBtn').onclick=function(){S.chords=!S.chords;store.set('chords',S.chords);show()};
 $('capoSel').onchange=function(){S.capo=parseInt(this.value,10)||0;store.set('capo',S.capo);show()};
 $('bigger').onclick=function(){S.fs=Math.min(34,S.fs+2);store.set('fs',S.fs);applyFs()};
 $('smaller').onclick=function(){S.fs=Math.max(14,S.fs-2);store.set('fs',S.fs);applyFs()};
 $('themeBtn').onclick=function(){var dark=document.documentElement.getAttribute('data-theme')==='dark'||(!S.theme&&window.matchMedia('(prefers-color-scheme:dark)').matches);S.theme=dark?'light':'dark';store.set('theme',S.theme);applyTheme()};
 document.addEventListener('keydown',function(e){var n=route();if(!n||e.target.tagName==='INPUT')return;var i=SONGS.map(function(s){return s.n}).indexOf(n);
  if(e.key==='ArrowRight'&&SONGS[i+1])location.hash='#/'+SONGS[i+1].n;if(e.key==='ArrowLeft'&&SONGS[i-1])location.hash='#/'+SONGS[i-1].n;});
 window.addEventListener('hashchange',show);
 applyTheme();applyFs();show();
 if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
